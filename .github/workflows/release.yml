# Build the desktop app and publish it as one self-contained ZIP.
#
# There is deliberately no local build path for this. The Rust shell in
# src-tauri/ is a few dozen lines that change almost never, so requiring a Rust
# toolchain and MSVC on the seeding machine would be overhead for nothing.
# Day-to-day work happens with `npm start`; this produces the thing people
# actually download.
#
# Two triggers:
#   workflow_dispatch  -- Actions tab -> release -> Run workflow. Builds and
#                         keeps artifacts. Tick `publish` to also put a release
#                         on the Releases page, tagged v<version>.
#   push tag v*        -- same build, published under that tag, which must be
#                         v<version>.
#
# <version> is src-tauri/tauri.conf.json's (package.json and Cargo.toml match it;
# a test pins that). The installed app's "Check for updates" (lib/update.js)
# reads the newest release's latest.json, so every release is a new version:
# bump it before publishing, or installed copies will not see the release.
#
# Updates are signed. With the TAURI_SIGNING_PRIVATE_KEY secret (and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD) set, the installer is signed and the
# release carries Seeding-Ops-<version>-windows-setup.exe, its .sig and latest.json.
# Publishing REFUSES (scripts/release-check.js) when config/updater.json has
# no pubkey (checked before the build), when there is no signature, or when the
# signature does not verify against that pubkey: each would ship a version that
# can never install an update. A test build (publish unticked) still runs
# unsigned. README, Desktop app > Updates.
#
# Order matters: the Bun sidecar must exist before tauri-action runs, because
# Tauri resolves externalBin at bundle time and fails if the binary is missing.
#
# Copied from mbaacc-stream-setup/.github/workflows/release.yml; names and the
# staged file list differ.

name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release (tagged v<version> from src-tauri/tauri.conf.json)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The version this build is. A v* tag must name it; fail before spending a build otherwise.
      - name: Version
        id: ver
        shell: bash
        run: |
          set -eu
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building $V"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version $V in src-tauri/tauri.conf.json"
            exit 1
          fi
          # A release to be published needs the public key in the app it ships (audit #1).
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${{ inputs.publish }}" = "true" ]; then
            node scripts/release-check.js --pubkey-only
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Rust compiles from scratch otherwise; this is the difference between a
      # 12 minute build and a 4 minute one.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # The suite is offline and fast; a release never ships code that fails it.
      - name: Test
        shell: bash
        run: NODE_OPTIONS="--require ./testlib/no-network.js" node --test

      - name: Build the server sidecar
        env:
          SIDECAR_TARGET: ${{ matrix.target }}
        run: npm run sidecar

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Build only, never publish. tauri-action skips creating a release
          # when tagName/releaseName are empty, which leaves the Publish step
          # below as the single path to the Releases page.
          tagName: ''
          releaseName: ''
          args: --target ${{ matrix.target }}

      # Always keep the artifacts, so a dispatch run is inspectable without a
      # release attached to it.
      - uses: actions/upload-artifact@v4
        with:
          name: seeding-ops-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      # The portable folder: everything needed to run, nothing else. Unzip it
      # anywhere, put a start.gg token in .env, and double-click -- no installer,
      # no Node, no repo. It is also exactly the layout a checkout wants (one
      # visible exe at the root, the server binary tucked into app/), so the same
      # two exes can be dropped into a working copy. Windows only -- the macOS
      # bundle has never been run on real hardware.
      #
      # app/server.js ships alongside its compiled twin on purpose: the loader
      # prefers it, so the ZIP a person receives is editable rather than opaque.
      # Build inputs (scripts/, src-tauri/, test/, docs/) stay out. registry/
      # gets the EMPTY template as tiers.csv, never this checkout's table; out/
      # and .env are never in the ZIP. A portable copy keeps its data beside the
      # exe (it has no installed.json, so lib/data-dir.js leaves it there).
      - name: Stage the portable folder
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -eu
          P=portable
          mkdir -p "$P/app" "$P/registry" "$P/out"
          cp "src-tauri/target/${{ matrix.target }}/release/seeding-ops.exe" "$P/Seeding Ops.exe"
          cp "src-tauri/binaries/seeding-server-${{ matrix.target }}.exe" "$P/app/seeding-server.exe"
          cp -r app/. "$P/app/"
          cp -r lib config views "$P/"
          cp registry/tiers.template.csv "$P/registry/tiers.csv"   # a new user starts with an empty tiers table, never Noah's
          cp pull.js seed.js seed.cmd app.cmd package.json README.md .env.example "$P/"
          echo "--- contents ---" && find "$P" -maxdepth 2 | sort

      - name: Zip it
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path portable/* -DestinationPath dist/Seeding-Ops-windows.zip -Force

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows-latest'
        with:
          name: seeding-ops-windows-portable-zip
          path: dist/Seeding-Ops-windows.zip

      # The installer under its versioned name, Seeding-Ops-<version>-windows-setup.exe (audit round 2
      # #1: 0.1.0 was published as Seeding-Ops-windows-setup.exe, so a fixed name let a stale 0.1.0
      # download stand in for the new one), signed for the updater when the key is there. The signature
      # is minisign, from the Tauri CLI (a devDependency), which is the format lib/update.js verifies
      # against config/updater.json's public key. No key: a warning, no .sig (publishing then refuses).
      - name: Sign the installer for the updater
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          ASSET="Seeding-Ops-${VERSION}-windows-setup.exe"
          INSTALLER=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe | head -1)
          cp "$INSTALLER" "dist/$ASSET"
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: this installer is not signed. Fine for a test build; publishing refuses an unsigned installer (README, Desktop app > Updates)."
            exit 0
          fi
          npx tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "dist/$ASSET"
          test -s "dist/$ASSET.sig"

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows-latest'
        with:
          name: seeding-ops-windows-installer-signed
          path: dist/Seeding-Ops-*-windows-setup.exe*
          if-no-files-found: warn

      # One publish path for both triggers, always tagged v<version>, and marked Latest: the app's
      # update check reads releases/latest/download/latest.json. Noah, 2026-11-05: only what a user
      # needs is in the release, the installer (plus, for the updater, its .sig and latest.json). The
      # portable ZIP stays a run artifact. Other assets of the same tag are removed.
      - name: Publish release
        if: matrix.platform == 'windows-latest' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          TAG="v${VERSION}"
          ASSET="Seeding-Ops-${VERSION}-windows-setup.exe"
          echo "publishing $TAG ($ASSET)"
          # Nothing is published unless the installer's signature verifies against the pubkey committed in
          # config/updater.json, with the app's own check (audit #1). Unsigned is refused too, so a release
          # marked Latest always carries latest.json (audit #10).
          node scripts/release-check.js --file "dist/$ASSET" --sig "dist/$ASSET.sig"
          node scripts/updater-manifest.js --version "$VERSION" --repo "$GITHUB_REPOSITORY" --sig "dist/$ASSET.sig" --asset "$ASSET" --out dist/latest.json
          ASSETS="dist/$ASSET dist/$ASSET.sig dist/latest.json"
          # The notes name this release's installer exactly: @VERSION@ is filled in below. The PowerShell
          # line is the README's (Desktop app > Updates), word for word but for the version.
          cat > dist/notes.md <<'NOTES'
          Download **Seeding-Ops-@VERSION@-windows-setup.exe**, run it, and open **Seeding Ops** from the Start menu.
          On first launch, paste a start.gg API key and press Save.

          Windows will say the publisher is unknown (the app is not code signed):
          choose **More info**, then **Run anyway**.

          **Already have Seeding Ops?** From 0.2.0 on, use **Check for updates** at the bottom of the
          home page.

          **Updating from 0.1.0** (it has no such button): don't double-click the installer. That way
          it uninstalls 0.1.0 first, which deletes your tiers table. Instead:
          1. Download **Seeding-Ops-@VERSION@-windows-setup.exe** (into your Downloads folder), and close Seeding Ops.
          2. Open **PowerShell** (Start menu, type PowerShell, Enter), paste this line and press Enter.
             It checks the file is a Seeding Ops 0.2.0 or later installer, copies your tiers table to a
             new, dated file on your Desktop (required: if either fails, nothing is installed), then runs
             the installer in update mode, which keeps everything:

          ```
          $dl=(New-Object -ComObject Shell.Application).NameSpace('shell:Downloads').Self.Path; $exe=Join-Path $dl 'Seeding-Ops-@VERSION@-windows-setup.exe'; $vi=(Get-Item -LiteralPath $exe -ErrorAction Stop).VersionInfo; if (-not ($vi -and $vi.ProductName -eq 'Seeding Ops' -and $vi.ProductVersion -match '^(\d+)\.(\d+)' -and ([int]$Matches[1] -ge 1 -or [int]$Matches[2] -ge 2))) { throw "Not a Seeding Ops 0.2.0 or later installer: $exe" }; $bak=Join-Path ([Environment]::GetFolderPath('Desktop')) ('seeding-ops-tiers-backup-' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '.csv'); Copy-Item -LiteralPath "$env:LOCALAPPDATA\Seeding Ops\registry\tiers.csv" -Destination $bak -ErrorAction Stop; if (-not ($bak -and (Test-Path -LiteralPath $bak))) { throw 'The tiers backup was not made; nothing was installed.' }; "Tiers backed up to $bak"; & $exe /P /UPDATE /R
          ```

          3. The app opens by itself and moves your tiers, tournaments and start.gg key to its data
             folder. Keep the Desktop backup until you've checked your tiers are there.

          If the line stops because there is no tiers table to copy, it was already lost and there is
          nothing more to lose: run the installer by double-clicking it.
          If your tiers are missing afterwards (the home page warns you), close the app and paste this
          line; it restores the largest seeding-ops-tiers-backup-*.csv on your Desktop:

          ```
          $b=Get-ChildItem -LiteralPath ([Environment]::GetFolderPath('Desktop')) -Filter 'seeding-ops-tiers-backup-*.csv' -ErrorAction Stop | Sort-Object Length | Select-Object -Last 1; if (-not $b) { throw 'No seeding-ops-tiers-backup-*.csv on the Desktop.' }; Copy-Item -LiteralPath $b.FullName -Destination "$env:LOCALAPPDATA\net.enpicie.seeding-ops\registry\tiers.csv" -ErrorAction Stop; "Restored $($b.Name)"
          ```
          NOTES
          sed -i "s/@VERSION@/${VERSION}/g" dist/notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Seeding Ops $VERSION" --notes-file dist/notes.md --target "$GITHUB_SHA"
          fi
          KEEP=" $(for f in $ASSETS; do printf '%s ' "$(basename "$f")"; done)"
          for a in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
            case "$KEEP" in *" $a "*) ;; *) gh release delete-asset "$TAG" "$a" -y ;; esac
          done
          gh release upload "$TAG" $ASSETS --clobber
          gh release edit "$TAG" --draft=false --latest --notes-file dist/notes.md
